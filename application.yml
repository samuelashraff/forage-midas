general:
  kafka-topic: trader-updates

incentives:
  base-url: http://localhost:8080

server:
  port: 33400

spring:
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: midas-core
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.jpmc.midascore.foundation
        spring.json.value.default.type: com.jpmc.midascore.foundation.Transaction

  datasource:
    url: jdbc:h2:mem:midasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""   # keep empty for local dev

  jpa:
    hibernate:
      ddl-auto: update   # dev-friendly; see notes below
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  # Enable H2 console for local development
  h2:
    console:
      enabled: true
      path: /h2-console